  <div class="auth-box">
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-tab">
      <button class="auth-tab-btn on" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button class="auth-tab-btn" id="tabSignup" onclick="switchTab('signup')">회원가입</button>

    <div id="loginForm">
      <div class="auth-field"><label>이메일</label><input type="email" id="loginEmail" placeholder="example@email.com"></div>

<script>
/* ══ 재단 계산 로직 ══ */
var seq=0,IDS=[];

function addItem(){
  seq++;
  var id="item"+seq;
  IDS.push(id);

  var card=document.createElement("div");
  card.className="icard";
  card.id=id;

  /* 헤더 */
  var head=document.createElement("div");
  head.className="ich";
  var num=document.createElement("div");
  num.className="inum";
  num.textContent=IDS.length;
  var ni=document.createElement("input");
  ni.className="iname";
  ni.type="text";
  ni.placeholder="항목 이름 (예: 문1)";
  ni.readOnly=true;
  ni.addEventListener("click",function(){
    var self=this;
    showIM("항목 이름",self.value,"text",function(v){self.value=v;});
  });
  var db=document.createElement("button");
  db.className="dbtn";
  db.textContent="✕";
  db.setAttribute("data-id",id);
  db.addEventListener("click",function(){delItem(this.getAttribute("data-id"));});
  head.appendChild(num);
  head.appendChild(ni);
  head.appendChild(db);

  /* 바디: 폭/길이/수량 1줄씩 */
  var body=document.createElement("div");
  body.className="icb";

  function mkDimRow(label,cls,defaultVal,unit){
    var row=document.createElement("div");
    row.className="dim-row";
    var lbl=document.createElement("span");
    lbl.className="dim-lbl";
    lbl.textContent=label;
    var inp=document.createElement("input");
    inp.type="number";
    inp.className="dim-inp "+cls;
    inp.value=defaultVal;
    inp.readOnly=true;
    inp.addEventListener("click",function(){
      var self=this;
      showIM(label, self.value===String(defaultVal)?"":self.value, "number", function(v){
        self.value=(v==="")?defaultVal:v;
      });
    });
    var un=document.createElement("span");
    un.className="dim-unit";
    un.textContent=unit;
    row.appendChild(lbl);
    row.appendChild(inp);
    row.appendChild(un);
    return row;
  }

  body.appendChild(mkDimRow("폭  W","iw",0,"mm"));
  body.appendChild(mkDimRow("길이  L","il",0,"mm"));
  body.appendChild(mkDimRow("수량","iq",1,"개"));

  card.appendChild(head);
  card.appendChild(body);
  document.getElementById("ilist").appendChild(card);
  document.getElementById("icnt").textContent=IDS.length+"개";
}

function delItem(id){
  var i=IDS.indexOf(id);
  if(i>-1)IDS.splice(i,1);
  var el=document.getElementById(id);
  if(el)el.parentNode.removeChild(el);
  document.getElementById("icnt").textContent=IDS.length+"개";
  var ns=document.querySelectorAll(".inum");
  for(var j=0;j<ns.length;j++)ns[j].textContent=j+1;
}

function getItems(){
  var res=[];
  for(var i=0;i<IDS.length;i++){
    var el=document.getElementById(IDS[i]);
    if(!el)continue;
    var nm=el.querySelector(".iname").value.trim()||("항목"+(i+1));
    var pW=parseFloat(el.querySelector(".iw").value)||0;
    var pL=parseFloat(el.querySelector(".il").value)||0;
    var qty=Math.max(1,parseInt(el.querySelector(".iq").value)||1);
    res.push({idx:i,cat:"6",name:nm,pW:pW,pL:pL,qty:qty});
  }
  return res;
}

function updSegs(segs,bx,pw,by,ph){var nx=[];for(var gi=0;gi<segs.length;gi++){var s=segs[gi],ox=Math.max(bx,s.x0),ex=Math.min(bx+pw,s.x1);if(ox>=ex){nx.push({x0:s.x0,x1:s.x1,h:s.h});}else{if(s.x0<ox)nx.push({x0:s.x0,x1:ox,h:s.h});nx.push({x0:ox,x1:ex,h:by+ph});if(ex<s.x1)nx.push({x0:ex,x1:s.x1,h:s.h});}}nx.sort(function(a,b){return a.x0-b.x0;});var mg=[];for(var ni=0;ni<nx.length;ni++){if(mg.length&&mg[mg.length-1].x1===nx[ni].x0&&mg[mg.length-1].h===nx[ni].h)mg[mg.length-1].x1=nx[ni].x1;else mg.push({x0:nx[ni].x0,x1:nx[ni].x1,h:nx[ni].h});}return mg;}
function bestPos(segs,pw,fw){var xs=[],gi;for(gi=0;gi<segs.length;gi++){var x0=segs[gi].x0;if(x0+pw<=fw){var f=false;for(var xi=0;xi<xs.length;xi++)if(xs[xi]===x0){f=true;break;}if(!f)xs.push(x0);}}if(!xs.length)xs.push(0);var bx=0,by=Infinity,bw=Infinity;for(var xi=0;xi<xs.length;xi++){var x=xs[xi],y=0,waste=0;for(gi=0;gi<segs.length;gi++){var ox=Math.max(x,segs[gi].x0),ex=Math.min(x+pw,segs[gi].x1);if(ox<ex&&segs[gi].h>y)y=segs[gi].h;}for(gi=0;gi<segs.length;gi++){var ox=Math.max(x,segs[gi].x0),ex=Math.min(x+pw,segs[gi].x1);if(ox<ex)waste+=(y-segs[gi].h)*(ex-ox);}if(y<by||(y===by&&waste<bw)){by=y;bw=waste;bx=x;}}if(by===Infinity){var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;by=mh;bx=0;}return{bx:bx,by:by};}
function mkStrips(flat){var ySet={},ys=[],strips=[];for(var i=0;i<flat.length;i++)ySet[flat[i].y]=true;for(var y in ySet)ys.push(parseFloat(y));ys.sort(function(a,b){return a-b;});for(var i=0;i<ys.length;i++){var y=ys[i],items=[],mb=0;for(var j=0;j<flat.length;j++)if(flat[j].y===y)items.push(flat[j]);for(var j=0;j<items.length;j++)if(items[j].y+items[j].pH>mb)mb=items[j].y+items[j].pH;strips.push({y:y,height:mb-y,slots:items});}return strips;}
function packFixed(pieces,fw){var sorts=[function(a,b){return b.pW*b.pH-a.pW*a.pH;},function(a,b){return b.pH-a.pH;},function(a,b){return b.pW-a.pW;},function(a,b){return(b.pW+b.pH)-(a.pW+a.pH);}];var bt=Infinity,bf=null;for(var si=0;si<sorts.length;si++){var sp=pieces.slice().sort(sorts[si]);var segs=[{x0:0,x1:fw,h:0}],placed=[],gi;for(var pi=0;pi<sp.length;pi++){var p=sp[pi];var pos=bestPos(segs,p.pW,fw);placed.push({label:p.label,cat:p.cat,pW:p.pW,pH:p.pH,x:pos.bx,y:pos.by,rotated:false});segs=updSegs(segs,pos.bx,p.pW,pos.by,p.pH);}var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;if(mh<bt){bt=mh;bf=placed.slice();}}return{flat:bf,total:bt,strips:mkStrips(bf)};}
function packRot(pieces,fw){var sorts=[function(a,b){return b.pW*b.pH-a.pW*a.pH;},function(a,b){return b.pH-a.pH;},function(a,b){return b.pW-a.pW;},function(a,b){return(b.pW+b.pH)-(a.pW+a.pH);},function(a,b){return Math.max(b.pW,b.pH)-Math.max(a.pW,a.pH);},function(a,b){return Math.min(b.pW,b.pH)-Math.min(a.pW,a.pH);}];var bt=Infinity,bf=null;for(var si=0;si<sorts.length;si++){var sp=pieces.slice().sort(sorts[si]);var n=sp.length;for(var strat=0;strat<3;strat++){var segs=[{x0:0,x1:fw,h:0}],placed=[],gi;for(var pi=0;pi<n;pi++){var p=sp[pi];var canR=(p.pH<=fw&&p.pW!==p.pH);var useR=false;if(canR){if(strat===1){var p0=bestPos(segs,p.pW,fw);var p1=bestPos(segs,p.pH,fw);useR=(p1.by<p0.by)||(p1.by===p0.by&&p.pH<p.pW);}else if(strat===2){useR=true;}}var pw=useR?p.pH:p.pW;var ph=useR?p.pW:p.pH;if(pw>fw){pw=p.pW;ph=p.pH;useR=false;}var pos=bestPos(segs,pw,fw);placed.push({label:p.label,cat:p.cat,pW:pw,pH:ph,x:pos.bx,y:pos.by,rotated:useR});segs=updSegs(segs,pos.bx,pw,pos.by,ph);}var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;if(mh<bt){bt=mh;bf=placed.slice();}}}return{flat:bf,total:bt,strips:mkStrips(bf)};}
function pack(pieces,fw){return hasPattern?packFixed(pieces,fw):packRot(pieces,fw);}

/* 카테고리 색상 (단일 색으로 통일) */
function cc(){return "#2c7be5";}

function calculate(){
  var items=getItems();
  if(!items.length){alert("항목을 먼저 추가하세요.");return;}
  var fw=parseFloat(document.getElementById("fw").value)||1220;
  var fl=(parseFloat(document.getElementById("fl").value)||0)*1000;
  var pieces=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    for(var q=0;q<it.qty;q++)
      pieces.push({label:it.qty>1?it.name+"("+(q+1)+"/"+it.qty+")":it.name,cat:"6",pW:it.pW,pH:it.pL});
  }
  var over=[];
  for(var i=0;i<pieces.length;i++)if(pieces[i].pW>fw)over.push(pieces[i]);
  if(over.length){
    var msg="필름 폭 초과:\n";
    for(var i=0;i<over.length;i++)msg+="- "+over[i].label+": "+over[i].pW+"mm\n";
    alert(msg);return;
  }
  var res=pack(pieces,fw);
  var ua=0;
  for(var i=0;i<pieces.length;i++)ua+=pieces[i].pW*pieces[i].pH;
  var eff=(ua/(fw*res.total)*100).toFixed(1);
  renderResult(res.flat,res.strips,res.total,eff,fl>0&&res.total>fl,fw,fl,isFlame);
  var sN=document.getElementById("siteName").value.trim()||"현장명 없음";
  var cN=document.getElementById("clientName").value.trim();
  var cP=document.getElementById("clientPhone").value.trim();
  var br=getBrand();
  var mn=document.getElementById("modelName").value.trim();
  saveHist(sN,cN,cP,br,mn,items,res.flat,res.total,eff,fw,fl,isFlame,hasPattern);
}

function renderResult(flat,strips,total,eff,ovl,fw,fl,flame){

  var info=el("div","info");

function drw(){
  if(!dD)return;
  var flat=dD.flat,strips=dD.strips,total=dD.total,fw=dD.fw;
  var cv=document.getElementById("dcv");if(!cv)return;
  var sc=dS,W=Math.round(fw*sc),H=Math.round(total*sc);
  cv.width=W;cv.height=H;cv.style.width=W+"px";cv.style.height=H+"px";
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#141414";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
  for(var m=100;m<total;m+=100){ctx.beginPath();ctx.moveTo(0,m*sc);ctx.lineTo(W,m*sc);ctx.stroke();}
  for(var m=100;m<fw;m+=100){ctx.beginPath();ctx.moveTo(m*sc,0);ctx.lineTo(m*sc,H);ctx.stroke();}
  for(var i=0;i<strips.length;i++){
    if(strips[i].y>0){
      var sy=strips[i].y*sc;
      ctx.strokeStyle="rgba(255,255,255,0.12)";ctx.lineWidth=1;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="rgba(255,255,255,0.3)";ctx.font="9px sans-serif";ctx.textAlign="left";ctx.textBaseline="top";
      ctx.fillText(strips[i].y.toLocaleString()+"mm",3,sy+2);
    }
  }
  var ey=H-1;
  ctx.strokeStyle="rgba(232,193,74,0.6)";ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(0,ey);ctx.lineTo(W,ey);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(232,193,74,0.85)";ctx.font="bold 9px sans-serif";ctx.textAlign="left";ctx.textBaseline="bottom";
  ctx.fillText("▲ "+total.toLocaleString()+"mm",3,ey-2);
  /* 조각 그리기 (단일 색상) */
  for(var i=0;i<flat.length;i++){
    var p=flat[i];
    var x=p.x*sc,y=p.y*sc,w=p.pW*sc,h=p.pH*sc;
    ctx.fillStyle="rgba(44,123,229,0.28)";ctx.fillRect(x+1,y+1,w-2,h-2);
    ctx.strokeStyle="rgba(44,123,229,0.9)";ctx.lineWidth=1.5;ctx.strokeRect(x+1,y+1,w-2,h-2);
    if(w>22&&h>14){
      ctx.textAlign="center";ctx.textBaseline="middle";
      var fs=Math.max(7,Math.min(12,w*0.13,h*0.2));
      ctx.font="700 "+fs+"px sans-serif";
      ctx.fillStyle="rgba(44,123,229,1)";
      var sn=p.label.length>9?p.label.slice(0,8)+"…":p.label;
      ctx.fillText(sn,x+w/2,y+h/2+(h>fs*3?-fs*0.7:0));
      if(h>fs*3){ctx.font=Math.max(6,fs-1.5)+"px sans-serif";ctx.fillStyle="rgba(255,255,255,0.4)";ctx.fillText(p.pW+"x"+p.pH,x+w/2,y+h/2+fs*0.8);}
    }
  }
  ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
  ctx.fillStyle="rgba(232,193,74,0.7)";ctx.font="9px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("< "+fw+"mm >",W/2,3);
}

function zD(d){dS=Math.min(Math.max(dB*0.3,dS*d),dB*10);drw();uzl();}
function rZ(){dS=dB;drw();uzl();}
function uzl(){var e=document.getElementById("zlbl");if(e)e.textContent=Math.round(dS/dB*100)+"%";}
function iZ(){
  var box=document.getElementById("dscroll");if(!box||zI)return;zI=true;
  box.addEventListener("wheel",function(e){e.preventDefault();dS=Math.min(Math.max(dB*0.3,dS*(e.deltaY<0?1.1:0.9)),dB*10);drw();uzl();},{passive:false});
  var ld=null;
  box.addEventListener("touchstart",function(e){if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
  box.addEventListener("touchmove",function(e){if(e.touches.length===2&&ld!==null){e.preventDefault();var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);dS=Math.min(Math.max(dB*0.3,dS*(d/ld)),dB*10);ld=d;drw();uzl();}},{passive:false});
  box.addEventListener("touchend",function(){ld=null;},{passive:true});
}

function showErr(msg){var el=document.getElementById('authMsg');el.style.cssText='background:#fff0f0;border:1px solid #ffcccc;color:#c0392b;display:block;border-radius:7px;padding:10px 14px;font-size:12px;margin-bottom:12px;line-height:1.5;';el.textContent=msg;}

function setStep(s){

function fmtPhone(inp){
  var v=inp.value.replace(/\D/g,'');
  if(v.length<=3)inp.value=v;
  else if(v.length<=7)inp.value=v.slice(0,3)+'-'+v.slice(3);
  else inp.value=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
}

/* ══ STEP1 → STEP2: 휴대폰 중복체크 강화 ══
   핵심 원인: goStep2()에서 Firestore 중복 체크는 하지만,
   이미 Firebase Auth에 전화번호가 등록된 경우(SMS 인증 기록)를 놓칠 수 있음.
   → Firestore + Auth 양측 확인 후 STEP2 진행.
   실질적 방어는 verifyAndJoin()의 linkWithCredential 단계에서 이미 됨.
   (auth/credential-already-in-use 에러가 중복 가입을 막음)
   추가로 goStep2에서 Firestore 조회를 반드시 await하도록 보장.
*/
function goStep2(){
  var name=document.getElementById('suName').value.trim();
  var email=document.getElementById('suEmail').value.trim();
  var pw=document.getElementById('suPw').value;
  var pwc=document.getElementById('suPwC').value;
  var rawPhone=document.getElementById('suPhone').value.replace(/\D/g,'');
  hideMsg();
  if(!name){showErr('이름을 입력해주세요.');return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('올바른 이메일을 입력해주세요.');return;}
  if(pw.length<6){showErr('비밀번호는 6자리 이상이어야 합니다.');return;}
  if(pw!==pwc){showErr('비밀번호가 일치하지 않습니다.');return;}
  if(rawPhone.length<10||rawPhone.length>11){showErr('올바른 핸드폰 번호를 입력해주세요.');return;}

  var e164='+82'+(rawPhone.startsWith('0')?rawPhone.slice(1):rawPhone);
  var btn=document.getElementById('nextBtn');
  btn.disabled=true;btn.textContent='중복 확인 중...';

  /* ── Firebase SDK 준비 확인 ── */
  if(typeof window._fbCheckPhone!=='function'){
    btn.disabled=false;btn.textContent='다음 → 핸드폰 인증';
    showErr('앱 초기화 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  /* ── Firestore에서 해당 전화번호 존재 여부 확인 ── */
  window._fbCheckPhone(e164)
    .then(function(exists){
      if(exists){
        btn.disabled=false;btn.textContent='다음 → 핸드폰 인증';
        showErr('이미 가입된 핸드폰 번호입니다.\n다른 번호를 사용하거나 로그인해주세요.');
        return;
      }
      /* 중복 없음 → 정보 저장 후 STEP2 이동 */
      pName=name;pEmail=email;pPw=pw;pPhone=rawPhone;pE164=e164;
      var disp=rawPhone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
      document.getElementById('suPhoneDisp').value=disp;
      btn.disabled=false;btn.textContent='다음 → 핸드폰 인증';
      setStep(2);
      initRcp();
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='다음 → 핸드폰 인증';
      showErr('확인 중 오류가 발생했습니다: '+e.message);
    });
}

function goStep1(){setStep(1);}

function initRcp(){
  if(rcpVerifier)return;
  try{
    rcpVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{
      'size':'invisible',
      'callback':function(){}
    });
  }catch(e){console.error('Rcp error:',e);}
}

/* STEP2: 인증번호 발송 */
function sendOtp(){
  hideMsg();
  if(!pE164){showErr('전화번호 정보가 없습니다. 이전 단계로 돌아가주세요.');return;}
  var btn=document.getElementById('sendOtpBtn');
  btn.disabled=true;btn.textContent='발송 중...';
  if(!rcpVerifier)initRcp();
  window._fbAuth.signInWithPhoneNumber(pE164,rcpVerifier)
    .then(function(result){
      cfmResult=result;
      var disp=pPhone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
      document.getElementById('otpDisp').textContent=disp;
      setStep(3);startTimer(180);
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='📱 인증번호 받기';
      if(rcpVerifier){try{rcpVerifier.clear();}catch(err){}rcpVerifier=null;}
      if(e.code==='auth/invalid-phone-number')showErr('올바르지 않은 번호입니다.');
      else if(e.code==='auth/too-many-requests')showErr('요청이 너무 많습니다. 잠시 후 다시 시도해주세요.');
      else showErr('SMS 발송 실패: '+e.message);
    });
}

function goStep2back(){
  setStep(2);
  var btn=document.getElementById('sendOtpBtn');
  btn.disabled=false;btn.textContent='📱 인증번호 받기';
}

function startTimer(sec){
  clearInterval(timerIv);
  var left=sec;
  var tEl=document.getElementById('otpTimer');
  var rBtn=document.getElementById('resendBtn');
  rBtn.className='resend-btn off';
  function tick(){
    var m=Math.floor(left/60),s=left%60;
    tEl.textContent=(m>0?m+'분 ':'')+s+'초';
    if(left<=0){clearInterval(timerIv);tEl.textContent='';rBtn.className='resend-btn';}
    left--;
  }
  tick();timerIv=setInterval(tick,1000);
}

function handleResend(){
  var btn=document.getElementById('resendBtn');
  if(btn.className.indexOf('off')>=0)return;
  goStep2back();rcpVerifier=null;initRcp();
}

/* ══ STEP3: OTP 확인 후 가입 ══
   linkWithCredential 과정에서:
   - auth/credential-already-in-use → 이미 이메일 계정 존재
   - auth/phone-number-already-exists (내부) → 전화번호 이미 Auth에 존재
   → Firestore 중복 체크 + Auth 에러 양측으로 중복 가입 완전 차단.
   가입 성공 시 Firestore에 phone 필드를 반드시 저장 (다음 가입 시 중복 체크에 사용).
*/
function verifyAndJoin(){
  var code=document.getElementById('otpInp').value.trim();
  hideMsg();
  if(code.length!==6){showErr('6자리 인증번호를 입력해주세요.');return;}
  if(!cfmResult){showErr('인증이 만료됐습니다. 처음부터 다시 시도해주세요.');return;}
  var btn=document.getElementById('verifyBtn');
  btn.disabled=true;btn.textContent='확인 중...';

  cfmResult.confirm(code)
    .then(function(result){
      var phoneUser=result.user;
      var emailCred=firebase.auth.EmailAuthProvider.credential(pEmail,pPw);
      return phoneUser.linkWithCredential(emailCred);
    })
    .then(function(linked){
      var user=linked.user;
      return user.updateProfile({displayName:pName})
        .then(function(){
          var disp=pPhone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
          /* phone 필드를 Firestore에 반드시 저장 → 이후 중복 체크에 사용 */
          return window._fbSaveUser(user.uid,{
            uid:user.uid,
            name:pName,
            email:pEmail,
            phone:pE164,          /* e164 형식 (+821012345678) */
            phoneDisplay:disp,
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          });
        });
    })
    .then(function(){
      clearInterval(timerIv);
      enterApp();
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='가입 완료';
      if(e.code==='auth/invalid-verification-code')showErr('인증번호가 올바르지 않습니다.');
      else if(e.code==='auth/code-expired')showErr('인증번호가 만료됐습니다. 재전송해주세요.');
      else if(e.code==='auth/email-already-in-use')showErr('이미 사용 중인 이메일입니다.');
      else if(e.code==='auth/credential-already-in-use')showErr('이미 사용 중인 이메일 또는 전화번호입니다.\n로그인 화면에서 로그인해주세요.');
      else showErr('가입 실패: '+e.message);
    });
}

function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var pw=document.getElementById('loginPw').value;
  hideMsg();
  if(!email||!pw){showErr('이메일과 비밀번호를 입력해주세요.');return;}
  if(typeof window._fbSignIn!=='function'){showErr('앱 초기화 중입니다. 잠시 후 다시 시도해주세요.');return;}
  window._fbSignIn(email,pw)
    .then(function(){enterApp();})
    .catch(function(e){
      if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')
        showErr('이메일 또는 비밀번호가 올바르지 않습니다.');
      else showErr('로그인 실패: '+e.message);
    });
}

function doGoogle(){
  window._fbGoogleLogin()
    .then(function(){enterApp();})
    .catch(function(e){
      if(e.code!=='auth/popup-closed-by-user')showErr('Google 로그인 실패: '+e.message);
    });
}

function doResetPw(){
  var email=document.getElementById('loginEmail').value.trim();
  if(!email){showErr('이메일을 먼저 입력해주세요.');return;}
  window._fbResetPw(email)
    .then(function(){showOk('비밀번호 재설정 이메일을 보냈습니다.');})
    .catch(function(e){showErr('전송 실패: '+e.message);});
}

function enterApp(){
  document.getElementById('authPage').style.display='none';
  if(curUser){
    var d=curUser.displayName||curUser.email||'';
    document.getElementById('userEmail').textContent=d;
  }
}

function doLogout(){
  showCfm('로그아웃','로그아웃 하시겠습니까?',function(){
    window._fbSignOut().then(function(){
      document.getElementById('authPage').style.display='flex';
      document.getElementById('userEmail').textContent='';
      switchTab('login');
    });
  });
}

function startAuthListen(){
  window._fbOnAuth(function(user){
    curUser=user;
    if(user)enterApp();
    else document.getElementById('authPage').style.display='flex';
  });
}
if(window._fbReady)startAuthListen();
else window._fbReadyCallback=startAuthListen;

/* ══ 브랜드 ══ */
function selBrand(btn){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");for(var i=0;i<btns.length;i++)btns[i].className="brand-btn";if(btn.className.indexOf("on")===-1)btn.className="brand-btn on";document.getElementById("brandCustom").value="";}
function getBrand(){var c=document.getElementById("brandCustom").value.trim();if(c)return c;var on=document.getElementById("brandGrid").querySelector(".brand-btn.on");return on?on.getAttribute("data-brand"):"";}
function setBrand(brand){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");var f=false;for(var i=0;i<btns.length;i++){if(btns[i].getAttribute("data-brand")===brand){btns[i].className="brand-btn on";f=true;}else btns[i].className="brand-btn";}if(!f){document.getElementById("brandCustom").value=brand||"";}else document.getElementById("brandCustom").value="";}
function clrBrand(){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");for(var i=0;i<btns.length;i++)btns[i].className="brand-btn";}

/* ══ 방염/패턴 ══ */
var isFlame=false,hasPattern=false;
function setFlame(v){isFlame=v;var y=document.getElementById("btn-flameyes"),n=document.getElementById("btn-flameno");if(v){y.style.background="#e8c14a";y.style.color="#1a1814";y.style.borderColor="#e8c14a";n.style.background="rgba(255,255,255,.1)";n.style.color="rgba(255,255,255,.6)";n.style.borderColor="rgba(255,255,255,.25)";}else{n.style.background="#e8c14a";n.style.color="#1a1814";n.style.borderColor="#e8c14a";y.style.background="rgba(255,255,255,.1)";y.style.color="rgba(255,255,255,.6)";y.style.borderColor="rgba(255,255,255,.25)";}}
function setPattern(v){hasPattern=v;var y=document.getElementById("btn-patternyes"),n=document.getElementById("btn-patternno");if(v){y.style.background="#e8c14a";y.style.color="#1a1814";y.style.borderColor="#e8c14a";n.style.background="rgba(255,255,255,.1)";n.style.color="rgba(255,255,255,.6)";n.style.borderColor="rgba(255,255,255,.25)";}else{n.style.background="#e8c14a";n.style.color="#1a1814";n.style.borderColor="#e8c14a";y.style.background="rgba(255,255,255,.1)";y.style.color="rgba(255,255,255,.6)";y.style.borderColor="rgba(255,255,255,.25)";}}

/* ══ 입력 팝업 ══ */
function showIM(lbl,val,type,cb){
  var ov=document.getElementById("inputModal");
  var fld=document.getElementById("inputFld");
  document.getElementById("inputLbl").textContent=lbl;
  fld.value=val||"";fld.type=type||"text";
  if(type==="number"&&fld.value==="0")fld.value="";
  ov.style.display="flex";
  setTimeout(function(){fld.focus();fld.select();},100);
  var ok=document.getElementById("inputOk").cloneNode(true);
  var ca=document.getElementById("inputCancel").cloneNode(true);
  document.getElementById("inputOk").parentNode.replaceChild(ok,document.getElementById("inputOk"));
  document.getElementById("inputCancel").parentNode.replaceChild(ca,document.getElementById("inputCancel"));
  function close(){ov.style.display="none";}
  document.getElementById("inputOk").onclick=function(){var v=document.getElementById("inputFld").value;close();cb(v);};
  document.getElementById("inputCancel").onclick=close;
  ov.onclick=function(e){if(e.target===ov)close();};
  document.getElementById("inputFld").onkeydown=function(e){if(e.key==="Enter")document.getElementById("inputOk").click();};
}

/* ══ 확인 모달 ══ */
function showCfm(title,msg,cb){
  var ov=document.getElementById("cfmModal");
  document.getElementById("cfmTitle").textContent=title;
  document.getElementById("cfmMsg").textContent=msg;
  ov.style.display="flex";
  var y=document.getElementById("cfmYes").cloneNode(true);
  var n=document.getElementById("cfmNo").cloneNode(true);
  document.getElementById("cfmYes").parentNode.replaceChild(y,document.getElementById("cfmYes"));
  document.getElementById("cfmNo").parentNode.replaceChild(n,document.getElementById("cfmNo"));
  document.getElementById("cfmYes").onclick=function(){ov.style.display="none";cb();};
  document.getElementById("cfmNo").onclick=function(){ov.style.display="none";};
  ov.onclick=function(e){if(e.target===ov)ov.style.display="none";};
}

/* ══ 검색 ══ */
function openSearch(){var cur=document.getElementById("searchBox").value;showIM("검색",cur,"text",function(v){var box=document.getElementById("searchBox");box.value=v;document.getElementById("searchClear").style.display=v?"block":"none";renderHist();});}
function clrSearch(){document.getElementById("searchBox").value="";document.getElementById("searchClear").style.display="none";renderHist();}

/* ══ 탭 ══ */
function showTab(tab){
  document.getElementById("page-calc").className="page"+(tab==="calc"?" on":"");
  document.getElementById("page-hist").className="page"+(tab==="hist"?" on":"");
  document.getElementById("tab-calc").className="tab"+(tab==="calc"?" on":"");
  document.getElementById("tab-hist").className="tab"+(tab==="hist"?" on":"");
  if(tab==="hist")renderHist();
}

/* ══ 기록 ══ */
function saveHist(sN,cN,cP,br,mn,items,flat,total,eff,fw,fl,flame,pattern){
  try{
    var now=new Date();
    var ds=now.getFullYear()+"."+(now.getMonth()+1)+"."+(("0"+now.getDate()).slice(-2))+" "+(("0"+now.getHours()).slice(-2))+":"+(("0"+now.getMinutes()).slice(-2));
    var rec={id:now.getTime(),date:ds,siteName:sN,clientName:cN,clientPhone:cP,brand:br,modelName:mn,items:items,flat:flat,total:total,eff:eff,fw:fw,fl:fl,flame:flame,pattern:pattern};
    var saved=[];try{saved=JSON.parse(localStorage.getItem("filmHistory")||"[]");}catch(e){}
    saved.unshift(rec);if(saved.length>50)saved=saved.slice(0,50);
    localStorage.setItem("filmHistory",JSON.stringify(saved));
    showToast();
  }catch(e){}
}

function showToast(){var t=document.getElementById("toast");t.className="save-toast show";setTimeout(function(){t.className="save-toast";},2000);}
function getHist(){try{return JSON.parse(localStorage.getItem("filmHistory")||"[]");}catch(e){return[];}}

function renderHist(){
  var list=document.getElementById("hist-list");if(!list)return;list.innerHTML="";
  var kw=(document.getElementById("searchBox")?document.getElementById("searchBox").value.trim().toLowerCase():"");
  var all=getHist();
  var recs=kw?all.filter(function(r){return(r.siteName||"").toLowerCase().indexOf(kw)>=0||(r.clientName||"").toLowerCase().indexOf(kw)>=0||(r.clientPhone||"").toLowerCase().indexOf(kw)>=0;}):all;
  if(!recs.length){
    var e=document.createElement("div");e.className="hist-empty";
    e.innerHTML="<div style='font-size:36px;margin-bottom:10px'>📋</div>아직 저장된 기록이 없어요<br>계산하면 자동으로 저장됩니다";
    list.appendChild(e);return;
  }
  for(var i=0;i<recs.length;i++){
    (function(rec){
      var card=document.createElement("div");card.className="hcard";
      var hd=document.createElement("div");hd.className="hcard-head";
      var left=document.createElement("div");left.style.flex="1";
      var dt=document.createElement("div");dt.className="hcard-date";dt.textContent=rec.date;
      var tl=document.createElement("div");tl.className="hcard-title";tl.textContent=rec.siteName||"현장명 없음";
      var sub=document.createElement("div");sub.style.cssText="font-size:11px;color:#5a5650;margin-top:2px;";
      sub.textContent=rec.items.length+"개 항목 · "+(rec.total/1000).toFixed(2)+"M · "+rec.eff+"% 사용률";
      var meta=document.createElement("div");meta.style.cssText="font-size:11px;color:#9a9590;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;";
      if(rec.clientName){var s=document.createElement("span");s.textContent="👤 "+rec.clientName;meta.appendChild(s);}
      if(rec.clientPhone){var s=document.createElement("span");s.textContent="📞 "+rec.clientPhone;meta.appendChild(s);}
      if(rec.brand||rec.modelName){var s=document.createElement("span");s.textContent="🎨 "+(rec.brand||"")+(rec.modelName?" "+rec.modelName:"");meta.appendChild(s);}
      var sf=document.createElement("span");sf.textContent=rec.flame?"🔥 방염":"비방염";meta.appendChild(sf);
      var sp=document.createElement("span");sp.textContent=rec.pattern?"🌲 패턴있음":"패턴없음";meta.appendChild(sp);
      left.appendChild(dt);left.appendChild(tl);left.appendChild(sub);left.appendChild(meta);
      hd.appendChild(left);card.appendChild(hd);
      var bd=document.createElement("div");bd.className="hcard-body";
      var info=document.createElement("div");info.style.cssText="font-size:11px;color:#9a9590;margin-bottom:8px;";
      info.textContent="필름: "+rec.fw+"mm x "+(rec.fl?rec.fl.toLocaleString()+"mm":"미설정")+" | "+(rec.flame?"방염":"비방염");
      bd.appendChild(info);
      var btns=document.createElement("div");btns.className="hcard-btns";
      var lb=document.createElement("button");lb.className="load-btn";lb.textContent="불러오기";
      lb.onclick=function(){loadRec(rec);};
      var db=document.createElement("button");db.className="del-btn2";db.textContent="삭제";
      db.onclick=function(){
        showCfm("기록 삭제","이 기록을 삭제할까요?\n삭제 후 복구할 수 없습니다.",function(){
          var saved=getHist();
          saved=saved.filter(function(r){return r.id!==rec.id;});
          localStorage.setItem("filmHistory",JSON.stringify(saved));
          renderHist();
        });
      };
      btns.appendChild(lb);btns.appendChild(db);bd.appendChild(btns);card.appendChild(bd);
      list.appendChild(card);
    })(recs[i]);
  }
}

function loadRec(rec){
  IDS=[];seq=0;
  document.getElementById("ilist").innerHTML="";
  document.getElementById("icnt").textContent="0개";
  document.getElementById("fw").value=rec.fw;
  document.getElementById("fl").value=rec.fl?rec.fl/1000:0;
  document.getElementById("siteName").value=rec.siteName||"";
  document.getElementById("clientName").value=rec.clientName||"";
  document.getElementById("clientPhone").value=rec.clientPhone||"";
  document.getElementById("modelName").value=rec.modelName||"";
  setBrand(rec.brand||"");
  setFlame(rec.flame||false);isFlame=rec.flame||false;
  setPattern(rec.pattern||false);hasPattern=rec.pattern||false;
  for(var i=0;i<rec.items.length;i++){
    var it=rec.items[i];
    addItemData(it.pW,it.pL,it.name,it.qty);
  }
  showTab("calc");
  setTimeout(function(){
    renderResult(rec.flat,[],rec.total,rec.eff,rec.fl>0&&rec.total>rec.fl,rec.fw,rec.fl,rec.flame||false);
  },100);
  alert("불러왔어요!");
}

function addItemData(pW,pL,name,qty){
  seq++;var id="item"+seq;IDS.push(id);
  var card=document.createElement("div");card.className="icard";card.id=id;
  var head=document.createElement("div");head.className="ich";
  var num=document.createElement("div");num.className="inum";num.textContent=IDS.length;
  var ni=document.createElement("input");ni.className="iname";ni.type="text";ni.readOnly=true;
  ni.addEventListener("click",function(){var self=this;showIM("항목 이름",self.value,"text",function(v){self.value=v;});});
  ni.value=name||"";
  var db=document.createElement("button");db.className="dbtn";db.textContent="✕";
  db.setAttribute("data-id",id);
  db.addEventListener("click",function(){delItem(this.getAttribute("data-id"));});
  head.appendChild(num);head.appendChild(ni);head.appendChild(db);

  var body=document.createElement("div");body.className="icb";
  function mkRow(label,cls,val,def,unit){
    var row=document.createElement("div");row.className="dim-row";
    var lbl=document.createElement("span");lbl.className="dim-lbl";lbl.textContent=label;
    var inp=document.createElement("input");inp.type="number";inp.className="dim-inp "+cls;inp.value=val;inp.readOnly=true;
    inp.addEventListener("click",function(){
      var self=this;
      showIM(label,self.value===String(def)?"":self.value,"number",function(v){self.value=(v==="")?def:v;});
    });
    var un=document.createElement("span");un.className="dim-unit";un.textContent=unit;
    row.appendChild(lbl);row.appendChild(inp);row.appendChild(un);
    return row;
  }
  body.appendChild(mkRow("폭  W","iw",pW,0,"mm"));
  body.appendChild(mkRow("길이  L","il",pL,0,"mm"));
  body.appendChild(mkRow("수량","iq",qty||1,1,"개"));
  card.appendChild(head);card.appendChild(body);
  document.getElementById("ilist").appendChild(card);
  document.getElementById("icnt").textContent=IDS.length+"개";
}

function init(){
  document.getElementById("addBtn").onclick=addItem;
  document.getElementById("calcBtn").onclick=calculate;
  addItem();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
