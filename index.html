<script>
(function(){
  var scripts=[
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'
  ];
  var loaded=0;
  function onLoad(){loaded++;if(loaded===scripts.length)initFB();}
  function initFB(){
    try{
      var cfg={
        apiKey:"AIzaSyCwCIERZXx-Tci1aJKHvV0V1ea5Z7-x25g",
        authDomain:"jaedanwang-90577.firebaseapp.com",
        projectId:"jaedanwang-90577",
        storageBucket:"jaedanwang-90577.firebasestorage.app",
        messagingSenderId:"245185517288",
        appId:"1:245185517288:web:ae0655944c7c78dd3d1b5d"
      };
      if(!firebase.apps.length)firebase.initializeApp(cfg);
      var auth=firebase.auth();
      var gp=new firebase.auth.GoogleAuthProvider();
      var db=firebase.firestore();
      window._auth=auth;
      window._db=db;

      /* 로그인 */
      window._signIn=function(e,p){return auth.signInWithEmailAndPassword(e,p);};
      window._signOut=function(){return auth.signOut();};
      window._googleLogin=function(){return auth.signInWithPopup(gp);};
      window._resetPw=function(e){return auth.sendPasswordResetEmail(e);};
      window._onAuth=function(cb){return auth.onAuthStateChanged(cb);};

      /*
       * 이메일 중복 체크:
       * 더미 비밀번호로 로그인 시도 → 오류 코드로 판단
       * auth/wrong-password = 이메일 존재 (중복)
       * auth/user-not-found = 이메일 없음 (사용 가능)
       * auth/invalid-credential = Firebase 업데이트 후 동일 의미
       */
      window._checkEmail=function(email){
        return auth.signInWithEmailAndPassword(email,'__DUMMY_PW_CHECK__')
          .then(function(){
            /* 만약 로그인 성공하면 즉시 로그아웃 후 중복 처리 */
            return auth.signOut().then(function(){return true;});
          })
          .catch(function(e){
            if(e.code==='auth/wrong-password'||
               e.code==='auth/invalid-credential'||
               e.code==='auth/invalid-login-credentials'){
              return true;  /* 이메일 존재 = 중복 */
            }
            if(e.code==='auth/user-not-found'||
               e.code==='auth/invalid-email'){
              return false; /* 이메일 없음 = 사용 가능 */
            }
            /* 기타 오류는 사용 가능으로 처리 */
            return false;
          });
      };

      /*
       * 전화번호 중복 체크: Firestore users 컬렉션에서 phone 필드 검색
       * Firestore 규칙: allow read: if true; 필요
       */
      window._checkPhone=function(e164){
        return db.collection('users').where('phone','==',e164).limit(1).get()
          .then(function(snap){return !snap.empty;})
          .catch(function(e){
            console.warn('Phone check error:',e.code,e.message);
            /* 규칙 오류 등 → false 반환하지 말고 오류 전파 */
            return Promise.reject(e);
          });
      };

      window._saveUser=function(uid,data){
        return db.collection('users').doc(uid).set(data,{merge:true});
      };

      window._fbReady=true;
      if(window._fbReadyCb)window._fbReadyCb();
    }catch(e){console.error('FB init error:',e);}
  }
  for(var i=0;i<scripts.length;i++){
    var s=document.createElement('script');
    s.src=scripts[i];
    s.onload=onLoad;
    s.onerror=function(){console.error('Firebase CDN 로드 실패');};
    document.head.appendChild(s);
  }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{background:#faf7f2;color:#2a2420;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;padding-bottom:56px;}

/* 헤더 */

.ftbtn{padding:4px 9px;border-radius:4px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pat-btn{padding:5px 12px;font-size:12px;border-radius:6px;}
.pat-btn.on{background:#27ae60;color:#fff;border-color:#27ae60;font-weight:700;}
/* 패턴 선택 바 */

.pbtn{flex:1;padding:5px 8px;border-radius:6px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;gap:6px;}
.pbtn.on{background:#1a5c8a;border-color:#2980b9;}
.pbtn-icon{font-size:15px;flex-shrink:0;line-height:1;}
.pbtn-txt{font-size:12px;font-weight:700;color:rgba(255,255,255,.45);white-space:nowrap;}
.pbtn.on .pbtn-txt{color:#fff;}
.pbtn-sub{font-size:9px;color:rgba(255,255,255,.25);white-space:nowrap;}

/* 레이아웃 */

.ph-t{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#9a8f84;}

.sl{font-size:9px;color:#9a8f84;}

.warn{background:#fff8e6;border:1px solid #f0c040;border-radius:7px;padding:8px 12px;font-size:12px;color:#8a6500;margin-bottom:9px;}

.zctrl{display:flex;align-items:center;gap:3px;}
.zb{background:#fff;border:1px solid #c4b8a8;border-radius:5px;color:#6a5f58;font-size:13px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.zr{width:auto;padding:0 7px;font-size:10px;}
.zl{font-size:10px;color:#9a8f84;min-width:32px;text-align:center;}
.leg{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;align-items:center;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#6a5f58;}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.tw{overflow-x:auto;}

.hcard-date{font-size:10px;color:#9a8f84;}

.im-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;}

.im-btns{display:flex;gap:8px;}
.im-cancel{flex:1;padding:10px;background:#ede8de;color:#6a5f58;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.im-ok{flex:1;padding:10px;background:#1a1814;color:#e8c14a;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}

.cfm-box{background:#fff;border-radius:14px;padding:20px 16px;width:82%;max-width:290px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.cfm-title{font-size:15px;font-weight:700;color:#2a2420;margin-bottom:6px;}
.cfm-msg{font-size:13px;color:#6a5f58;margin-bottom:16px;line-height:1.6;white-space:pre-line;}
.cfm-btns{display:flex;gap:8px;}
.cfm-no{flex:1;padding:10px;background:#faf7f2;color:#6a5f58;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}

/* 인증 페이지 */
.auth-pg{position:fixed;top:0;left:0;right:0;bottom:0;background:#faf7f2;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.auth-logo{text-align:center;margin-bottom:18px;flex-shrink:0;}
.auth-logo h1{font-size:30px;font-weight:900;color:#1a1814;}
.auth-logo h1 span{color:#e8c14a;}
.auth-logo p{font-size:11px;color:#9a8f84;letter-spacing:2px;margin-top:3px;}
.auth-card{background:#fff;border-radius:14px;padding:18px 16px;width:100%;max-width:350px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.auth-tabs{display:flex;margin-bottom:16px;background:#ede8de;border-radius:8px;padding:3px;}
.auth-tab{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:#9a8f84;font-family:inherit;}
.auth-tab.on{background:#fff;color:#1a1814;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.auth-msg{border-radius:7px;padding:9px 12px;font-size:12px;margin-bottom:10px;display:none;line-height:1.5;}
.auth-msg.err{background:#fff0f0;border:1px solid #ffcccc;color:#c0392b;}
.auth-msg.ok{background:#f0fff0;border:1px solid #90EE90;color:#1a7a1a;}
.af{margin-bottom:10px;}
.af label{font-size:10px;font-weight:700;letter-spacing:1px;color:#9a8f84;text-transform:uppercase;display:block;margin-bottom:4px;}
.af input{width:100%;padding:10px 12px;background:#faf7f2;border:1.5px solid #d8d0c4;border-radius:8px;font-size:14px;color:#1a1814;font-family:inherit;}
.af input:focus{outline:none;border-color:#1a5c8a;}
.auth-btn{width:100%;padding:12px;background:#1a1814;color:#e8c14a;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:2px;}
.auth-btn:disabled{opacity:.45;cursor:not-allowed;}
.auth-div{text-align:center;margin:12px 0;font-size:12px;color:#9a8f84;position:relative;}
.auth-div::before,.auth-div::after{content:"";position:absolute;top:50%;width:36%;height:1px;background:#d8d0c4;}
.auth-div::before{left:0;}
.auth-div::after{right:0;}
.google-btn{width:100%;padding:10px;background:#fff;border:1.5px solid #d8d0c4;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#1a1814;font-family:inherit;}
.auth-forgot{text-align:center;margin-top:10px;font-size:12px;color:#1a5c8a;cursor:pointer;}
.su-step{display:none;}
.su-step.on{display:block;}
.step-bar{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.sdot{width:24px;height:24px;border-radius:50%;border:2px solid #d8d0c4;background:#fff;font-size:11px;font-weight:700;color:#9a8f84;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sdot.done{background:#27ae60;border-color:#27ae60;color:#fff;}
.sdot.act{background:#1a1814;border-color:#1a1814;color:#e8c14a;}

<script>
/* ══ 재단 계산 ══ */
var CATS=[{id:"1",lb:"문"},{id:"1-1",lb:"문틀"},{id:"2",lb:"창"},{id:"2-1",lb:"창틀"},{id:"3",lb:"싱크대 문"},{id:"3-1",lb:"싱크대 틀"},{id:"4",lb:"알판"},{id:"5",lb:"몰딩"},{id:"6",lb:"기타"}];
var CC={"1":"#2c7be5","1-1":"#74b3fa","2":"#27ae60","2-1":"#82e0aa","3":"#e67e22","3-1":"#f0b27a","4":"#8e44ad","5":"#c0392b","6":"#7f8c8d"};
function cc(c){return CC[c]||"#7f8c8d";}
function cl(c){for(var i=0;i<CATS.length;i++)if(CATS[i].id===c)return CATS[i].lb;return c;}
var seq=0,IDS=[];

function addItem(){
  seq++;var id="item"+seq;IDS.push(id);
  var card=document.createElement("div");card.className="icard";card.id=id;
  var head=document.createElement("div");head.className="ich";
  var num=document.createElement("div");num.className="inum";num.style.background="#7f8c8d";num.textContent=IDS.length;
  var ni=document.createElement("input");ni.className="iname";ni.type="text";ni.placeholder="항목 이름";ni.readOnly=true;
  ni.addEventListener("click",function(){var s=this;showIM("항목 이름",s.value,"text",function(v){s.value=v;});});
  var db=document.createElement("button");db.className="dbtn";db.textContent="✕";
  db.setAttribute("data-id",id);db.addEventListener("click",function(){delItem(this.getAttribute("data-id"));});
  head.appendChild(num);head.appendChild(ni);head.appendChild(db);
  var body=document.createElement("div");body.className="icb";
  function mkRow(lbl,cls,def){
    var row=document.createElement("div");row.className="inp-row";
    var l=document.createElement("span");l.className="inp-lbl";l.textContent=lbl;
    var inp=document.createElement("input");inp.type="number";inp.className="inp-num "+cls;inp.value=def;
    var dv=String(def);inp.readOnly=true;
    inp.addEventListener("click",function(){
      var s=this;showIM(lbl,s.value===dv?"":s.value,"number",function(v){s.value=(v==="")?dv:v;});
    });
    var u=document.createElement("span");u.className="inp-unit";u.textContent=cls==="iq"?"개":"mm";
    row.appendChild(l);row.appendChild(inp);row.appendChild(u);return row;
  }
  body.appendChild(mkRow("폭 W","iw",0));
  body.appendChild(mkRow("길이 L","il",0));
  body.appendChild(mkRow("수량","iq",1));
  card.appendChild(head);card.appendChild(body);
  document.getElementById("ilist").appendChild(card);
  document.getElementById("icnt").textContent=IDS.length+"개";
}

function delItem(id){
  var i=IDS.indexOf(id);if(i>-1)IDS.splice(i,1);
  var el=document.getElementById(id);if(el)el.parentNode.removeChild(el);
  document.getElementById("icnt").textContent=IDS.length+"개";
  var ns=document.querySelectorAll(".inum");for(var i=0;i<ns.length;i++)ns[i].textContent=i+1;
}

function getItems(){
  var res=[];
  for(var i=0;i<IDS.length;i++){
    var el=document.getElementById(IDS[i]);if(!el)continue;
    var nm=el.querySelector(".iname").value.trim()||("항목"+(i+1));
    var pW=parseFloat(el.querySelector(".iw").value)||0;
    var pL=parseFloat(el.querySelector(".il").value)||0;
    var qty=Math.max(1,parseInt(el.querySelector(".iq").value)||1);
    res.push({idx:i,cat:"6",name:nm,pW:pW,pL:pL,qty:qty});
  }
  return res;
}

function updSegs(segs,bx,pw,by,ph){
  var nx=[];
  for(var gi=0;gi<segs.length;gi++){
    var s=segs[gi],ox=Math.max(bx,s.x0),ex=Math.min(bx+pw,s.x1);
    if(ox>=ex){nx.push({x0:s.x0,x1:s.x1,h:s.h});}
    else{if(s.x0<ox)nx.push({x0:s.x0,x1:ox,h:s.h});nx.push({x0:ox,x1:ex,h:by+ph});if(ex<s.x1)nx.push({x0:ex,x1:s.x1,h:s.h});}
  }
  nx.sort(function(a,b){return a.x0-b.x0;});
  var mg=[];
  for(var ni=0;ni<nx.length;ni++){
    if(mg.length&&mg[mg.length-1].x1===nx[ni].x0&&mg[mg.length-1].h===nx[ni].h)mg[mg.length-1].x1=nx[ni].x1;
    else mg.push({x0:nx[ni].x0,x1:nx[ni].x1,h:nx[ni].h});
  }
  return mg;
}

function bPos(segs,pw,fw){
  var xs=[],gi;
  for(gi=0;gi<segs.length;gi++){var x0=segs[gi].x0;if(x0+pw<=fw){var f=false;for(var xi=0;xi<xs.length;xi++)if(xs[xi]===x0){f=true;break;}if(!f)xs.push(x0);}}
  if(!xs.length)xs.push(0);
  var bx=0,by=Infinity,bw=Infinity;
  for(var xi=0;xi<xs.length;xi++){
    var x=xs[xi],y=0,waste=0;
    for(gi=0;gi<segs.length;gi++){var ox=Math.max(x,segs[gi].x0),ex=Math.min(x+pw,segs[gi].x1);if(ox<ex&&segs[gi].h>y)y=segs[gi].h;}
    for(gi=0;gi<segs.length;gi++){var ox=Math.max(x,segs[gi].x0),ex=Math.min(x+pw,segs[gi].x1);if(ox<ex)waste+=(y-segs[gi].h)*(ex-ox);}
    if(y<by||(y===by&&waste<bw)){by=y;bw=waste;bx=x;}
  }
  if(by===Infinity){var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;by=mh;bx=0;}
  return{bx:bx,by:by};
}

function mkStrips(flat){
  var ySet={},ys=[],strips=[];
  for(var i=0;i<flat.length;i++)ySet[flat[i].y]=true;
  for(var y in ySet)ys.push(parseFloat(y));
  ys.sort(function(a,b){return a-b;});
  for(var i=0;i<ys.length;i++){
    var y=ys[i],items=[],mb=0;
    for(var j=0;j<flat.length;j++)if(flat[j].y===y)items.push(flat[j]);
    for(var j=0;j<items.length;j++)if(items[j].y+items[j].pH>mb)mb=items[j].y+items[j].pH;
    strips.push({y:y,height:mb-y,slots:items});
  }
  return strips;
}

function packFixed(pieces,fw){
  var sorts=[function(a,b){return b.pW*b.pH-a.pW*a.pH;},function(a,b){return b.pH-a.pH;},function(a,b){return b.pW-a.pW;},function(a,b){return(b.pW+b.pH)-(a.pW+a.pH);}];
  var bt=Infinity,bf=null;
  for(var si=0;si<sorts.length;si++){
    var sp=pieces.slice().sort(sorts[si]);var segs=[{x0:0,x1:fw,h:0}],placed=[],gi;
    for(var pi=0;pi<sp.length;pi++){var p=sp[pi];var pos=bPos(segs,p.pW,fw);placed.push({label:p.label,cat:p.cat,pW:p.pW,pH:p.pH,x:pos.bx,y:pos.by,rotated:false});segs=updSegs(segs,pos.bx,p.pW,pos.by,p.pH);}
    var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;
    if(mh<bt){bt=mh;bf=placed.slice();}
  }
  return{flat:bf,total:bt,strips:mkStrips(bf)};
}

function packRot(pieces,fw){
  var sorts=[function(a,b){return b.pW*b.pH-a.pW*a.pH;},function(a,b){return b.pH-a.pH;},function(a,b){return b.pW-a.pW;},function(a,b){return(b.pW+b.pH)-(a.pW+a.pH);},function(a,b){return Math.max(b.pW,b.pH)-Math.max(a.pW,a.pH);},function(a,b){return Math.min(b.pW,b.pH)-Math.min(a.pW,a.pH);}];
  var bt=Infinity,bf=null;
  for(var si=0;si<sorts.length;si++){
    var sp=pieces.slice().sort(sorts[si]);var n=sp.length;
    for(var strat=0;strat<3;strat++){
      var segs=[{x0:0,x1:fw,h:0}],placed=[],gi;
      for(var pi=0;pi<n;pi++){
        var p=sp[pi];var canR=(p.pH<=fw&&p.pW!==p.pH);var useR=false;
        if(canR){if(strat===1){var p0=bPos(segs,p.pW,fw);var p1=bPos(segs,p.pH,fw);useR=(p1.by<p0.by)||(p1.by===p0.by&&p.pH<p.pW);}else if(strat===2)useR=true;}
        var pw=useR?p.pH:p.pW;var ph=useR?p.pW:p.pH;if(pw>fw){pw=p.pW;ph=p.pH;useR=false;}
        var pos=bPos(segs,pw,fw);placed.push({label:p.label,cat:p.cat,pW:pw,pH:ph,x:pos.bx,y:pos.by,rotated:useR});segs=updSegs(segs,pos.bx,pw,pos.by,ph);
      }
      var mh=0;for(gi=0;gi<segs.length;gi++)if(segs[gi].h>mh)mh=segs[gi].h;
      if(mh<bt){bt=mh;bf=placed.slice();}
    }
  }
  return{flat:bf,total:bt,strips:mkStrips(bf)};
}

function pack(pieces,fw){return hasPat?packFixed(pieces,fw):packRot(pieces,fw);}

  var res=pack(pieces,fw);

function showErr(msg){var e=document.getElementById('authMsg');e.className='auth-msg err';e.textContent=msg;e.style.display='block';}
function showOk(msg){var e=document.getElementById('authMsg');e.className='auth-msg ok';e.textContent=msg;e.style.display='block';}
function hideMsg(){document.getElementById('authMsg').style.display='none';}

function switchTab(m){
  document.getElementById('tabL').className='auth-tab'+(m==='L'?' on':'');
  document.getElementById('tabS').className='auth-tab'+(m==='S'?' on':'');
  document.getElementById('loginFrm').style.display=m==='L'?'block':'none';
  document.getElementById('signupFrm').style.display=m==='S'?'block':'none';
  hideMsg();if(m==='S')setStep(1);

function setStep(s){
  for(var i=1;i<=3;i++){
    var el=document.getElementById('ss'+i);if(el)el.className='su-step'+(i===s?' on':'');
    var d=document.getElementById('sd'+i);
    if(d){if(i<s)d.className='sdot done';else if(i===s)d.className='sdot act';else d.className='sdot';}
    var lb=document.getElementById('sb'+i);if(lb)lb.className='slbl'+(i===s?' act':'');
  }
  for(var i=1;i<=2;i++){var ln=document.getElementById('sl'+i);if(ln)ln.className='sline'+(i<s?' done':'');}
  hideMsg();
}

function fmtPh(inp){
  var v=inp.value.replace(/\D/g,'');
  if(v.length<=3)inp.value=v;
  else if(v.length<=7)inp.value=v.slice(0,3)+'-'+v.slice(3);
  else inp.value=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
}

/* ══ STEP1 → STEP2
   이메일: signInWithEmailAndPassword 더미 시도로 존재 여부 판단
   - auth/wrong-password or auth/invalid-credential → 이메일 존재 (중복)
   - auth/user-not-found → 이메일 없음 (사용 가능)
   전화번호: Firestore where('phone','==',e164) 검색
   * Firestore 규칙: allow read: if true; 필요
══ */
function goS2(){
  var name=document.getElementById('sName').value.trim();
  var email=document.getElementById('sEmail').value.trim();
  var pw=document.getElementById('sPw').value;
  var pwc=document.getElementById('sPwC').value;
  var rawPh=document.getElementById('sPhone').value.replace(/\D/g,'');
  hideMsg();
  if(!name){showErr('이름을 입력해주세요.');return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('올바른 이메일을 입력해주세요.');return;}
  if(pw.length<6){showErr('비밀번호는 6자리 이상이어야 합니다.');return;}
  if(pw!==pwc){showErr('비밀번호가 일치하지 않습니다.');return;}
  if(rawPh.length<10||rawPh.length>11){showErr('올바른 핸드폰 번호를 입력해주세요.');return;}
  var e164='+82'+(rawPh.startsWith('0')?rawPh.slice(1):rawPh);
  pName=name;pEmail=email;pPw=pw;pPhone=rawPh;pE164=e164;
  document.getElementById('sPhDisp').value=rawPh.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
  setStep(2);initRcp();
}

function goS1(){setStep(1);}

function initRcp(){
  if(rcpV)return;
  try{rcpV=new firebase.auth.RecaptchaVerifier('recaptcha-container',{'size':'invisible','callback':function(){}});}
  catch(e){console.error('Rcp error:',e);}
}

function sendOtp(){
  hideMsg();
  if(!pE164){showErr('전화번호 정보가 없습니다. 이전 단계로 돌아가주세요.');return;}
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='발송 중...';
  if(!rcpV)initRcp();

  /* 익명 로그인 후 전화번호 link
   * → 해당 번호가 이미 다른 계정에 있으면 credential-already-in-use 반환
   * → 이게 가장 확실한 전화번호 중복 방지 방법 */
  window._auth.signInAnonymously()
    .then(function(anonResult){
      var anonUser=anonResult.user;
      var phoneProvider=new firebase.auth.PhoneAuthProvider();
      return phoneProvider.verifyPhoneNumber(pE164,rcpV)
        .then(function(verificationId){
          /* verificationId 저장, anonUser도 저장 */
          window._anonUser=anonUser;
          window._verificationId=verificationId;
          var disp=pPhone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
          document.getElementById('otpDisp').textContent=disp;
          setStep(3);startTimer(180);
        });
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='📱 인증번호 받기';
      if(rcpV){try{rcpV.clear();}catch(err){}rcpV=null;}
      if(e.code==='auth/invalid-phone-number')showErr('올바르지 않은 번호입니다.');
      else if(e.code==='auth/too-many-requests')showErr('요청이 너무 많습니다. 잠시 후 다시 시도해주세요.');
      else showErr('SMS 발송 실패: '+e.message);
    });
}

function goS2back(){
  setStep(2);
  var btn=document.getElementById('sendBtn');
  btn.disabled=false;btn.textContent='📱 인증번호 받기';
}

function startTimer(sec){
  clearInterval(timerIv);var left=sec;
  var tEl=document.getElementById('otpTimer');
  var rBtn=document.getElementById('resendBtn');
  rBtn.className='rb off';
  function tick(){
    var m=Math.floor(left/60),s=left%60;
    tEl.textContent=(m>0?m+'분 ':'')+s+'초';
    if(left<=0){clearInterval(timerIv);tEl.textContent='';rBtn.className='rb';}
    left--;
  }
  tick();timerIv=setInterval(tick,1000);
}

function handleResend(){
  if(document.getElementById('resendBtn').className.indexOf('off')>=0)return;
  goS2back();rcpV=null;initRcp();
}

/* OTP 확인 + linkWithCredential (전화번호 Firebase Auth에 영구 유지) */
function doJoin(){
  var code=document.getElementById('otpInp').value.trim();
  hideMsg();
  if(code.length!==6){showErr('6자리 인증번호를 입력해주세요.');return;}
  if(!window._verificationId){showErr('인증이 만료됐습니다. 처음부터 다시 시도해주세요.');return;}
  var btn=document.getElementById('verifyBtn');
  btn.disabled=true;btn.textContent='확인 중...';

  /* PhoneAuthCredential 생성 */
  var phoneCred=firebase.auth.PhoneAuthProvider.credential(
    window._verificationId, code
  );

  /* 익명계정에 전화번호 link
   * → 이미 가입된 번호: credential-already-in-use → 100% 차단
   * → 신규 번호: 성공 → 이어서 이메일도 link */
  window._anonUser.linkWithCredential(phoneCred)
    .then(function(result){
      /* 전화번호 연결 성공 → 이메일+비밀번호도 link */
      var user=result.user;
      var emailCred=firebase.auth.EmailAuthProvider.credential(pEmail,pPw);
      return user.linkWithCredential(emailCred);
    })
    .then(function(result){
      /* 이메일 연결 성공 → 프로필 + Firestore 저장 */
      var user=result.user;
      return user.updateProfile({displayName:pName}).then(function(){
        var disp=pPhone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
        return window._saveUser(user.uid,{
          uid:user.uid,name:pName,email:pEmail,
          phone:pE164,phoneDisplay:disp,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    })
    .then(function(){
      clearInterval(timerIv);
      window._anonUser=null;
      window._verificationId=null;
      enterApp();
    })
    .catch(function(e){
      btn.disabled=false;btn.textContent='가입 완료';
      var code=e.code||'';
      console.error('doJoin error:',code,e.message);

      if(code==='auth/credential-already-in-use'||code==='auth/phone-number-already-exists'){
        /* 전화번호 이미 사용 중 → 익명계정 삭제 후 차단 */
        if(window._anonUser){window._anonUser.delete().catch(function(){});}
        showErr('이미 가입된 전화번호입니다.\n다른 번호를 사용하거나 로그인해주세요.');
      } else if(code==='auth/invalid-verification-code'){
        showErr('인증번호가 올바르지 않습니다.');
      } else if(code==='auth/code-expired'){
        showErr('인증번호가 만료됐습니다. 재전송해주세요.');
      } else if(code==='auth/email-already-in-use'){
        /* 이메일 중복 → 전화link는 됐으므로 전화계정 삭제 */
        if(window._anonUser){window._anonUser.delete().catch(function(){});}
        showErr('이미 사용 중인 이메일입니다.\n다른 이메일을 사용하거나 로그인해주세요.');
      } else if(code==='auth/provider-already-linked'){
        showErr('이미 연결된 계정입니다.');
      } else {
        showErr('가입 실패: '+(e.message||code||'알 수 없는 오류'));
      }
    });
}

function doLogin(){
  var email=document.getElementById('lEmail').value.trim();
  var pw=document.getElementById('lPw').value;
  hideMsg();
  if(!email||!pw){showErr('이메일과 비밀번호를 입력해주세요.');return;}
  if(typeof window._signIn!=='function'){showErr('앱 초기화 중입니다. 잠시 후 다시 시도해주세요.');return;}
  window._signIn(email,pw).then(function(){enterApp();}).catch(function(e){
    if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')
      showErr('이메일 또는 비밀번호가 올바르지 않습니다.');
    else showErr('로그인 실패: '+e.message);
  });
}

function doGoogle(){
  window._googleLogin().then(function(){enterApp();}).catch(function(e){
    if(e.code!=='auth/popup-closed-by-user')showErr('Google 로그인 실패: '+e.message);
  });
}

function doResetPw(){
  var email=document.getElementById('lEmail').value.trim();
  if(!email){showErr('이메일을 먼저 입력해주세요.');return;}
  window._resetPw(email).then(function(){showOk('비밀번호 재설정 이메일을 보냈습니다.');}).catch(function(e){showErr('전송 실패: '+e.message);});
}

function enterApp(){
  document.getElementById('authPg').style.display='none';
  if(curUser){document.getElementById('uEmail').textContent=curUser.displayName||curUser.email||'';}
}

function doLogout(){
  showCfm('로그아웃','로그아웃 하시겠습니까?',function(){
    window._signOut().then(function(){
      document.getElementById('authPg').style.display='flex';
      document.getElementById('uEmail').textContent='';
      switchTab('L');
    });
  });
}

function startAuthListen(){
  window._onAuth(function(user){
    curUser=user;
    if(user)enterApp();
    else document.getElementById('authPg').style.display='flex';
  });
}
if(window._fbReady)startAuthListen();
else window._fbReadyCb=startAuthListen;

/* ══ 브랜드 ══ */
function selBrand(btn){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");for(var i=0;i<btns.length;i++)btns[i].className="brand-btn";if(btn.className.indexOf("on")===-1)btn.className="brand-btn on";document.getElementById("brandCustom").value="";}
function getBrand(){var c=document.getElementById("brandCustom").value.trim();if(c)return c;var on=document.getElementById("brandGrid").querySelector(".brand-btn.on");return on?on.getAttribute("data-brand"):"";}
function setBrand(brand){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");var f=false;for(var i=0;i<btns.length;i++){if(btns[i].getAttribute("data-brand")===brand){btns[i].className="brand-btn on";f=true;}else btns[i].className="brand-btn";}if(!f)document.getElementById("brandCustom").value=brand||"";else document.getElementById("brandCustom").value="";}
function clrBrand(){var btns=document.getElementById("brandGrid").querySelectorAll(".brand-btn");for(var i=0;i<btns.length;i++)btns[i].className="brand-btn";}

/* ══ 방염/패턴 ══ */
var isFlame=false,hasPat=false;
function setFlame(v){isFlame=v;var y=document.getElementById("flameY"),n=document.getElementById("flameN");y.className="ftbtn"+(v?" on":"");n.className="ftbtn"+(!v?" on":"");}
function setPat(v){
  hasPat=v;
  var y=document.getElementById("patY"),n=document.getElementById("patN");
  y.className="pbtn"+(v?" on":"");
  n.className="pbtn"+(!v?" on":"");
}

/* ══ 입력 팝업 ══ */
function showIM(lbl,val,type,cb){
  var ov=document.getElementById("imOv");var fld=document.getElementById("imFld");
  document.getElementById("imLbl").textContent=lbl;fld.value=val||"";fld.type=type||"text";
  if(type==="number"&&fld.value==="0")fld.value="";
  ov.style.display="flex";setTimeout(function(){fld.focus();fld.select();},80);
  var ok=document.getElementById("imOk").cloneNode(true);var ca=document.getElementById("imCancel").cloneNode(true);
  document.getElementById("imOk").parentNode.replaceChild(ok,document.getElementById("imOk"));
  document.getElementById("imCancel").parentNode.replaceChild(ca,document.getElementById("imCancel"));
  function close(){ov.style.display="none";}
  document.getElementById("imOk").onclick=function(){var v=document.getElementById("imFld").value;close();cb(v);};
  document.getElementById("imCancel").onclick=close;
  ov.onclick=function(e){if(e.target===ov)close();};
  document.getElementById("imFld").onkeydown=function(e){if(e.key==="Enter")document.getElementById("imOk").click();};
}

/* ══ 확인 모달 ══ */
function showCfm(title,msg,cb){
  var ov=document.getElementById("cfmOv");
  document.getElementById("cfmTitle").textContent=title;document.getElementById("cfmMsg").textContent=msg;ov.style.display="flex";
  var y=document.getElementById("cfmYes").cloneNode(true);var n=document.getElementById("cfmNo").cloneNode(true);
  document.getElementById("cfmYes").parentNode.replaceChild(y,document.getElementById("cfmYes"));
  document.getElementById("cfmNo").parentNode.replaceChild(n,document.getElementById("cfmNo"));
  document.getElementById("cfmYes").onclick=function(){ov.style.display="none";cb();};
  document.getElementById("cfmNo").onclick=function(){ov.style.display="none";};
  ov.onclick=function(e){if(e.target===ov)ov.style.display="none";};
}

/* ══ 검색 ══ */
function openSearch(){var cur=document.getElementById("searchBox").value;showIM("검색",cur,"text",function(v){document.getElementById("searchBox").value=v;document.getElementById("sClear").style.display=v?"block":"none";renderHist();});}
function clrSearch(){document.getElementById("searchBox").value="";document.getElementById("sClear").style.display="none";renderHist();}

/* ══ 탭 ══ */
function showTab(tab){document.getElementById("pg-calc").className="page"+(tab==="calc"?" on":"");document.getElementById("pg-hist").className="page"+(tab==="hist"?" on":"");document.getElementById("tab-calc").className="tab"+(tab==="calc"?" on":"");document.getElementById("tab-hist").className="tab"+(tab==="hist"?" on":"");if(tab==="hist")renderHist();}

/* ══ 기록 ══ */
function saveHist(sN,cN,cP,br,mn,items,flat,total,eff,fw,fl,flame,pattern){
  try{
    var uid=curUser?curUser.uid:'guest';
    var key='filmHist_'+uid;
    var now=new Date();
    var ds=now.getFullYear()+"."+(now.getMonth()+1)+"."+(("0"+now.getDate()).slice(-2))+" "+(("0"+now.getHours()).slice(-2))+":"+(("0"+now.getMinutes()).slice(-2));
    var rec={id:now.getTime(),date:ds,siteName:sN,clientName:cN,clientPhone:cP,brand:br,modelName:mn,items:items,flat:flat,total:total,eff:eff,fw:fw,fl:fl,flame:flame,pattern:pattern};
    var saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}
    saved.unshift(rec);if(saved.length>50)saved=saved.slice(0,50);
    localStorage.setItem(key,JSON.stringify(saved));showToast();
  }catch(e){}
}
function getHist(){
  try{
    var uid=curUser?curUser.uid:'guest';
    return JSON.parse(localStorage.getItem('filmHist_'+uid)||'[]');
  }catch(e){return[];}
}

function renderHist(){
  var list=document.getElementById("hist-list");if(!list)return;list.innerHTML="";
  var kw=(document.getElementById("searchBox")?document.getElementById("searchBox").value.trim().toLowerCase():"");
  var all=getHist();
  var recs=kw?all.filter(function(r){return(r.siteName||"").toLowerCase().indexOf(kw)>=0||(r.clientName||"").toLowerCase().indexOf(kw)>=0||(r.clientPhone||"").toLowerCase().indexOf(kw)>=0;}):all;
  if(!recs.length){var e=document.createElement("div");e.className="hist-empty";e.innerHTML="<div style='font-size:32px;margin-bottom:8px'>📋</div>아직 저장된 기록이 없어요<br>계산하면 자동으로 저장됩니다";list.appendChild(e);return;}
  for(var i=0;i<recs.length;i++){(function(rec){
    var card=document.createElement("div");card.className="hcard";
    var hd=document.createElement("div");hd.className="hcard-head";
    var dt=document.createElement("div");dt.className="hcard-date";dt.textContent=rec.date;
    var tl=document.createElement("div");tl.className="hcard-title";tl.textContent=rec.siteName||"현장명 없음";
    var sub=document.createElement("div");sub.className="hcard-sub";sub.textContent=rec.items.length+"개 항목 · "+(rec.total/1000).toFixed(2)+"M · "+rec.eff+"% 사용률";
    var meta=document.createElement("div");meta.className="hcard-meta";
    if(rec.clientName){var s=document.createElement("span");s.textContent="👤 "+rec.clientName;meta.appendChild(s);}
    if(rec.clientPhone){var s=document.createElement("span");s.textContent="📞 "+rec.clientPhone;meta.appendChild(s);}
    if(rec.brand||rec.modelName){var s=document.createElement("span");s.textContent="🎨 "+(rec.brand||"")+(rec.modelName?" "+rec.modelName:"");meta.appendChild(s);}
    var sf=document.createElement("span");sf.textContent=rec.flame?"🔥 방염":"비방염";meta.appendChild(sf);
    var sp=document.createElement("span");sp.textContent=rec.pattern?"🌲 패턴있음":"패턴없음";meta.appendChild(sp);
    var badges=document.createElement("div");badges.className="hcard-badges";
    var cm={};for(var j=0;j<rec.items.length;j++){var nm=cl(rec.items[j].cat);cm[nm]=(cm[nm]||0)+rec.items[j].qty;}
    for(var nm in cm){var b=document.createElement("span");b.className="badge";b.textContent=nm+" "+cm[nm]+"개";badges.appendChild(b);}
    hd.appendChild(dt);hd.appendChild(tl);hd.appendChild(sub);hd.appendChild(meta);hd.appendChild(badges);card.appendChild(hd);
    var bd=document.createElement("div");bd.className="hcard-body";
    var info=document.createElement("div");info.style.cssText="font-size:11px;color:#9a9590;margin-bottom:7px;";
    info.textContent="필름: "+rec.fw+"mm × "+(rec.fl?rec.fl.toLocaleString()+"mm":"미설정")+" | "+(rec.flame?"방염":"비방염");bd.appendChild(info);
    var btns=document.createElement("div");btns.className="hcard-btns";
    var lb=document.createElement("button");lb.className="load-btn";lb.textContent="불러오기";lb.onclick=function(){loadRec(rec);};
    var db=document.createElement("button");db.className="del-btn";db.textContent="삭제";
    db.onclick=function(){showCfm("기록 삭제","이 기록을 삭제할까요?\n삭제 후 복구할 수 없습니다.",function(){var saved=getHist();saved=saved.filter(function(r){return r.id!==rec.id;});localStorage.setItem("filmHist_"+(curUser?curUser.uid:"guest"),JSON.stringify(saved));renderHist();});};
    btns.appendChild(lb);btns.appendChild(db);bd.appendChild(btns);card.appendChild(bd);list.appendChild(card);
  })(recs[i]);}
}

function loadRec(rec){
  IDS=[];seq=0;document.getElementById("ilist").innerHTML="";document.getElementById("icnt").textContent="0개";
  document.getElementById("fw").value=rec.fw;document.getElementById("fl").value=rec.fl?rec.fl/1000:0;
  document.getElementById("siteName").value=rec.siteName||"";document.getElementById("clientName").value=rec.clientName||"";
  document.getElementById("clientPhone").value=rec.clientPhone||"";document.getElementById("modelName").value=rec.modelName||"";
  setBrand(rec.brand||"");setFlame(rec.flame||false);isFlame=rec.flame||false;setPat(rec.pattern||false);hasPat=rec.pattern||false;
  for(var i=0;i<rec.items.length;i++){var it=rec.items[i];addItemData(it.cat,it.pW,it.pL,it.name,it.qty);}
  showTab("calc");
  setTimeout(function(){renderResult(rec.flat,[],rec.total,rec.eff,rec.fl>0&&rec.total>rec.fl,rec.fw,rec.fl);},100);
  alert("불러왔어요!");
}

function addItemData(cat,pW,pL,name,qty){
  seq++;var id="item"+seq;IDS.push(id);
  var card=document.createElement("div");card.className="icard";card.id=id;
  var head=document.createElement("div");head.className="ich";
  var num=document.createElement("div");num.className="inum";num.style.background="#7f8c8d";num.textContent=IDS.length;
  var ni=document.createElement("input");ni.className="iname";ni.type="text";ni.readOnly=true;ni.value=name||"";
  ni.addEventListener("click",function(){var s=this;showIM("항목 이름",s.value,"text",function(v){s.value=v;});});
  var db=document.createElement("button");db.className="dbtn";db.textContent="✕";db.setAttribute("data-id",id);db.addEventListener("click",function(){delItem(this.getAttribute("data-id"));});
  head.appendChild(num);head.appendChild(ni);head.appendChild(db);
  var body=document.createElement("div");body.className="icb";
  function mkRowD(lbl,cls,val,def){
    var row=document.createElement("div");row.className="inp-row";
    var l=document.createElement("span");l.className="inp-lbl";l.textContent=lbl;
    var inp=document.createElement("input");inp.type="number";inp.className="inp-num "+cls;inp.value=val;
    var dv=String(def);
    inp.addEventListener("focus",function(){if(this.value===dv)this.value="";});
    inp.addEventListener("blur",function(){if(this.value==="")this.value=dv;});
    var u=document.createElement("span");u.className="inp-unit";u.textContent=cls==="iq"?"개":"mm";
    row.appendChild(l);row.appendChild(inp);row.appendChild(u);return row;
  }
  body.appendChild(mkRowD("폭 W","iw",pW,0));body.appendChild(mkRowD("길이 L","il",pL,0));body.appendChild(mkRowD("수량","iq",qty||1,1));
  card.appendChild(head);card.appendChild(body);document.getElementById("ilist").appendChild(card);document.getElementById("icnt").textContent=IDS.length+"개";
}

function init(){document.getElementById("addBtn").onclick=addItem;document.getElementById("calcBtn").onclick=calculate;addItem();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
</script>
